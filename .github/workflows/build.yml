name: Build MineStormStatus

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - java: '17'
            profile: java17
          - java: '21'
            profile: java21
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build with Maven
        run: mvn -B -ntp clean package -P${{ matrix.profile }}

      - name: Upload jar (JDK ${{ matrix.java }})
        uses: actions/upload-artifact@v4
        with:
          name: MineStormStatus-java${{ matrix.java }}
          path: target/MineStormStatus-*-java${{ matrix.java }}.jar
          if-no-files-found: error

  bundle:
    name: Bundle both jars
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download jars
        uses: actions/download-artifact@v4
        with:
          pattern: MineStormStatus-java*
          path: jars
          merge-multiple: true

      - name: Upload both jars together
        uses: actions/upload-artifact@v4
        with:
          name: MineStormStatus-all-jars
          path: jars/*.jar
          if-no-files-found: error
