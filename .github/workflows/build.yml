name: Build MineStormStatus

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - java: '17'
            profile: java17
          - java: '21'
            profile: java21
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build with Maven
        run: mvn -B -ntp clean package -P${{ matrix.profile }}

      - name: Verify jars
        run: |
          ls -la bukkit/target/MineStormStatus-Bukkit-*.jar
          ls -la bungee/target/MineStormStatus-Bungee-*.jar
          ls -la velocity/target/MineStormStatus-Velocity-*.jar
          unzip -p bukkit/target/MineStormStatus-Bukkit-*-java${{ matrix.java }}.jar plugin.yml \
              | grep -q "main: com.minestorm.status.MineStormStatus"

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: MineStormStatus-java${{ matrix.java }}
          if-no-files-found: error
          path: |
            bukkit/target/MineStormStatus-Bukkit-*.jar
            bungee/target/MineStormStatus-Bungee-*.jar
            velocity/target/MineStormStatus-Velocity-*.jar
