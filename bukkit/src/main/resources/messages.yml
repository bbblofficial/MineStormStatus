# ============================================================
#  MineStormStatus - messages.yml   (Created by Muvixo)
#
#  COLORS
#    &0-&9 &a-&f  colors      &l bold  &o italic  &n underline  &m strike  &k magic  &r reset
#    &#RRGGBB     hex color (1.16+ servers; older servers use the nearest classic color)
#
#  PLACEHOLDERS
#    {prefix}   the "prefix" below
#    {player}   player name   (alerts.*, afk.returned-broadcast, join.welcome-back)
#    {status}   status name   (join.status-restored)
#    {seconds}  idle timeout in seconds (afk.now-idle)
#    {time}     how long the player was idle (afk.returned)
#    {version}  plugin version (commands.info)
#    PlaceholderAPI placeholders also work if PlaceholderAPI is installed.
#
#  An empty message ('') is not sent at all.
# ============================================================
config-version: 2

prefix: '&8[&b&lMineStormStatus&8] &r'

general:
  players-only: '{prefix}&cOnly players can use this command.'
  no-permission: '{prefix}&cYou do not have permission to do that.'

status-names:
  busy: '&c&lBusy'
  idle: '&e&lIdle'
  away: '&7&lAway'

status:
  usage: '{prefix}&cUsage: &f/status [busy|idle|away|clear]'
  set:
    busy: '{prefix}&7Your status is now &c&lBusy&7.'
    idle: '{prefix}&7Your status is now &e&lIdle&7.'
    away: '{prefix}&7Your status is now &7&lAway&7.'
  cleared: '{prefix}&7Your status has been cleared.'
  nothing-to-clear: '{prefix}&7You do not have an active status.'

alerts:
  busy: '{prefix}&cThis player is currently busy and cannot respond right now.'
  idle: '{prefix}&eThis player is currently idle and cannot respond right now.'

afk:
  now-idle: '{prefix}&eYou are currently idle.'
  returned: '{prefix}&aYou are no longer idle. &7(Idle for &f{time}&7)'
  returned-broadcast: '{prefix}&f{player} &7is back and no longer idle.'

join:
  welcome-back: '{prefix}&aWelcome back, &f{player}&a!'
  status-restored: '{prefix}&7Your status was restored to {status}&7.'

hud:
  idle: '&fYou are currently &e&lIDLE'
  busy: '&fYou are currently &c&lBusy'
  away: '&fYou are currently &7&laway'

commands:
  usage: '{prefix}&cUsage: &f/minestormstatus [help|busy|idle|away|clear|creator|info|reload]'
  unknown: '{prefix}&cUnknown subcommand. Use &f/minestormstatus help&c.'
  creator: '{prefix}&7Created by &6&lMuvixo'
  info: '{prefix}&7Running &bMineStormStatus v{version} &8| &7Created by &6Muvixo'
  reload-success: '{prefix}&aConfiguration and messages reloaded.'
  help:
    - '{prefix}&6&lMineStormStatus Help'
    - '&e/status [busy|idle|away|clear] &7- Set or clear your status'
    - '&e/minestormstatus busy|idle|away|clear &7- Same as /status'
    - '&e/minestormstatus creator &7- Show the creator'
    - '&e/minestormstatus info &7- Show plugin version'
    - '&e/minestormstatus reload &7- Reload config.yml and messages.yml'
